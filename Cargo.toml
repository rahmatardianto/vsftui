[package]
name = "sftui"
version = "0.1.0"
edition = "2024"
authors = ["SFTUI Contributors"]
description = "Terminal UI for SFTP/FTP synchronization with vscode-sftp compatibility and Git uncommitted auto-sync"

[dependencies]
# Async Runtime
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"

# Terminal UI
ratatui = { version = "0.30", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# Protocols: SFTP & FTP
ssh2 = "0.9"
suppaftp = { version = "12.2", default-features = false, features = ["tokio"] }

# Configuration & JSONC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json_comments = "0.2"
shellexpand = "3.1"

# File Watcher & Glob Matching
notify = "8.2"
notify-debouncer-mini = "0.7"
globset = "0.4"
ignore = "0.4"

# Git Integration
git2 = "0.21"

# CLI & Utilities
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
futures-util = "0.3"
parking_lot = "0.12"
json5 = "1.3.7"

[dev-dependencies]
tempfile = "3.27"

